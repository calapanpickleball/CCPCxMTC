<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCPC x MTC Dual Meet | Game Schedule & Scoreboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* Scoreboard Graphic Styling */
    .scoreboard-container {
      max-width: 700px;
      margin: 0 auto 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .teams-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 6px;
    }

    .team-info {
      display: flex;
      flex-direction: column;
    }

    .team-left {
      align-items: flex-start;
      color: #0b6fa4;
    }

    .team-right {
      align-items: flex-end;
      color: #000000;
    }

    .team-title {
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .team-subtitle {
      font-weight: 500;
      font-size: 20px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .bar-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .score-bar-outer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      height: 60px;
      border: 1px solid #1c3b5e;
      background-color: #e8e8e8;
      overflow: hidden;
      border-radius: 6px;
    }

    .score-box {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 400;
      color: #ffffff;
      min-width: 60px;
      transition: width 0.4s ease;
    }

    .score-left {
      background-color: #0b6fa4;
    }

    .score-right {
      background-color: #000000;
    }

    .target-marker {
      position: absolute;
      left: 50%;
      top: -10px;
      bottom: -10px;
      width: 2px;
      background-color: #000000;
      transform: translateX(-50%);
      z-index: 2;
    }

    .target-text {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #000000;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    /* Game Schedule Viewer Styling */
    h1 {
      margin-bottom: 4px;
      font-size: 28px;
      color: #111827;
    }

    h4 {
      margin-bottom: 16px;
      color: #4b5563;
      font-weight: normal;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    select,
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .summary {
      margin-bottom: 12px;
      font-size: 14px;
      color: #4b5563;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #111827;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover {
      background: #f9fafb;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .empty,
    .loading,
    .error {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
      color: #6b7280;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .error {
      color: #991b1b;
      background: #fee2e2;
    }

    .mobile-cards {
      display: none;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    .team {
      background: #f9fafb;
      padding: 10px;
      border-radius: 10px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
      color: #111827;
      text-align: center;
    }

    .vs {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 22px;
      }

      .filters {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .table-wrapper {
        display: none;
      }

      .mobile-cards {
        display: block;
      }

      .team-title {
        font-size: 22px;
      }

      .team-subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- TOP SECTION: Scoreboard Chart -->
    <div class="scoreboard-container">
      <div class="teams-header">
        <div class="team-info team-left">
          <span class="team-title">Calapan City</span>
          <span class="team-subtitle">Pickleball Club</span>
        </div>
        <div class="team-info team-right">
          <span class="team-title">Morning</span>
          <span class="team-subtitle">Tickle Club</span>
        </div>
      </div>

      <div class="bar-wrapper">
        <div class="score-bar-outer">
          <div id="score-ccpc" class="score-box score-left">0</div>
          <div id="score-mtc" class="score-box score-right">0</div>
        </div>
        <div class="target-marker"></div>
      </div>

      <div class="target-text">65 to WIN</div>
    </div>

    <!-- BOTTOM SECTION: Game List View -->
    <h1>CCPC x MTC Dual Meet</h1>
    <h4>August 16, 2026 | Paloo 4Ecom Center</h4>

    <div class="filters">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>

      <input
        type="search"
        id="searchInput"
        placeholder="Search player name..."
        autocomplete="off"
      />
    </div>

    <div id="summary" class="summary"></div>
    <div id="content" class="loading">Loading data...</div>
  </div>

  <script>
    // Primary CSV Source
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRndZpCQdvlPD8Pr0XcQMIgshTo7BZ90TOjwpuLTYqm44xyQXekQUgz0oTWyje9J1IKQBWaOTPjLfhU/pub?gid=1085376916&single=true&output=csv";
    const MAX_SCORE = 128;

    let allRows = [];
    let filteredRows = [];
    let lastFetchedTime = null;

    const categoryFilter = document.getElementById("categoryFilter");
    const searchInput = document.getElementById("searchInput");
    const content = document.getElementById("content");
    const summary = document.getElementById("summary");
    const elCCPC = document.getElementById("score-ccpc");
    const elMTC = document.getElementById("score-mtc");

    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentValue = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          currentValue += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          currentRow.push(currentValue.trim());
          currentValue = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (currentValue || currentRow.length) {
            currentRow.push(currentValue.trim());
            rows.push(currentRow);
            currentRow = [];
            currentValue = "";
          }
          if (char === "\r" && nextChar === "\n") i++;
        } else {
          currentValue += char;
        }
      }

      if (currentValue || currentRow.length) {
        currentRow.push(currentValue.trim());
        rows.push(currentRow);
      }

      return rows;
    }

    function normalizeHeader(header) {
      return header.trim().toUpperCase().replace(/\s+/g, "");
    }

    function rowsToObjects(csvRows) {
      const headers = csvRows[0].map(normalizeHeader);
      return csvRows.slice(1).map(row => {
        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = row[index] || "";
        });
        return obj;
      }).filter(row => Object.values(row).some(value => value !== ""));
    }

    function getPlayerText(row) {
      return [row.TEAM1, row.TEAM2].join(" ").toLowerCase();
    }

    function populateCategories() {
      const currentSelection = categoryFilter.value;
      const categories = [...new Set(allRows.map(row => row.CATEGORY).filter(Boolean))].sort();

      categoryFilter.innerHTML = '<option value="">All Categories</option>';
      categories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryFilter.appendChild(option);
      });

      categoryFilter.value = currentSelection;
    }

    function applyFilters() {
      const selectedCategory = categoryFilter.value;
      const searchTerm = searchInput.value.trim().toLowerCase();

      filteredRows = allRows.filter(row => {
        const matchesCategory = !selectedCategory || row.CATEGORY === selectedCategory;
        const matchesSearch = !searchTerm || getPlayerText(row).includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      render();
    }

    function statusBadge(status) {
      const cleanStatus = status || "Pending";
      const className = cleanStatus.toLowerCase() === "completed" ? "completed" : "pending";
      return `<span class="badge ${className}">${escapeHTML(cleanStatus)}</span>`;
    }

    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function updateScoreChart() {
      let ccpcScore = 0;
      let mtcScore = 0;

      allRows.forEach(row => {
        if (parseInt(row.TEAM1SCORE, 10) === 11) {
          ccpcScore++;
        }
        if (parseInt(row.TEAM2SCORE, 10) === 11) {
          mtcScore++;
        }
      });

      elCCPC.textContent = ccpcScore;
      elMTC.textContent = mtcScore;

      const ccpcPct = Math.min((ccpcScore / MAX_SCORE) * 100, 100);
      const mtcPct = Math.min((mtcScore / MAX_SCORE) * 100, 100);

      elCCPC.style.width = ccpcPct + "%";
      elMTC.style.width = mtcPct + "%";
    }

    function render() {
      const timeString = lastFetchedTime ? ` | Last updated: ${lastFetchedTime.toLocaleString()}` : "";
      summary.textContent = `Showing ${filteredRows.length} of ${allRows.length} games${timeString}`;

      if (!filteredRows.length) {
        content.className = "empty";
        content.innerHTML = "No games found.";
        return;
      }

      content.className = "";
      content.innerHTML = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Category</th>
                <th>Game No.</th>
                <th>CCPC Team</th>
                <th>Score</th>
                <th>Score</th>
                <th>MTC Team</th>
                <th>Estimated Time</th>
              </tr>
            </thead>
            <tbody>
              ${filteredRows.map(row => `
                <tr>
                  <td>${escapeHTML(row.CATEGORY)}</td>
                  <td>${escapeHTML(row.GAMENO)}</td>
                  <td>${escapeHTML(row.TEAM1)}</td>
                  <td>${escapeHTML(row.TEAM1SCORE)}</td>
                  <td>${escapeHTML(row.TEAM2SCORE)}</td>
                  <td>${escapeHTML(row.TEAM2)}</td>
                  <td>${statusBadge(row.STATUS)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>

        <div class="mobile-cards">
          ${filteredRows.map(row => `
            <div class="card">
              <div class="card-header">
                <span>${escapeHTML(row.CATEGORY)}</span>
                <span>Game ${escapeHTML(row.GAMENO)}</span>
              </div>

              <div class="matchup">
                <div class="team">
                  <strong>CCPC Team</strong><br />
                  ${escapeHTML(row.TEAM1)}
                  <div class="score">${escapeHTML(row.TEAM1SCORE)}</div>
                </div>

                <div class="vs">VS</div>

                <div class="team">
                  <strong>MTC Team</strong><br />
                  ${escapeHTML(row.TEAM2)}
                  <div class="score">${escapeHTML(row.TEAM2SCORE)}</div>
                </div>
              </div>

              ${statusBadge(row.STATUS)}
            </div>
          `).join("")}
        </div>
      `;
    }

    async function loadData() {
      try {
        // Enforce cache prevention across browser and proxy CDNs
        const response = await fetch(`${CSV_URL}&nocache=${Date.now()}`, {
          cache: "no-store",
          headers: {
            "Cache-Control": "no-cache, no-store, must-revalidate",
            "Pragma": "no-cache"
          }
        });

        if (!response.ok) {
          throw new Error("Unable to fetch CSV data.");
        }

        const csvText = await response.text();
        lastFetchedTime = new Date();
        const csvRows = parseCSV(csvText);

        if (!csvRows.length) {
          throw new Error("CSV is empty.");
        }

        allRows = rowsToObjects(csvRows);

        updateScoreChart();
        populateCategories();
        applyFilters();
      } catch (error) {
        content.className = "error";
        content.innerHTML = escapeHTML(error.message);
      }
    }

    categoryFilter.addEventListener("change", applyFilters);
    searchInput.addEventListener("input", applyFilters);

    // Initial load and automatic background updates every 5 seconds
    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
